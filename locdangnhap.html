<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="./locdkdn.css">
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css">
    <title>Login</title>
</head>
<body>

        <header class="main-header">
        <div href="index.html" class="logo-container">
            <img src="./img/logo_9oH.jpg" alt="Logo Trống Đồng" class="logo-img">
            <span class="logo-text">Cuu Long History</span>
        </div>

        <nav class="nav-links">
            <ul>
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="binhindex.html">Nội dung</a></li>
                <li><a href="#">Dịch vụ</a></li>
                <li><a href="linhindex.html">Tin tức</a></li>
                <li><a href="khoaindex.html">Liên hệ</a></li>
                <li class="mobile-login"><a href="locdangnhap.html">Đăng nhập / Đăng kí</a></li>
            </ul>
        </nav>

        <div class="action-btn">
        <a href="#" class="cart-icon">
            <img src="./img/GioHang.jpg" alt="Giỏ hàng">
    </a>

            <button class="login-btn" onclick="window.location.href='locdangnhap.html'">Đăng nhập/ Đăng kí</button>
            <button class="menu-toggle-btn" onclick="toggleMenu()">☰</button>
    </div>

    </header>

    <script>
        function toggleMenu() {
            const navLinks = document.querySelector('.nav-links');
            navLinks.classList.toggle('active');
        }
    </script>


   <div id="wrapper">
        <form action="" id="form-login" onsubmit="handleLogin(event)">
            <h1 class="form-heading">Form đăng nhập</h1>

            <p id="error-message"></p>
            
            <div class="form-group">
                <i class="far fa-user"></i>
                <input type="text" id="login-username" class="form-input" placeholder="Tên đăng nhập" required>
            </div>
            <div class="form-group">
                <i class="fas fa-key"></i>
                <input type="password" id="login-password" class="form-input" placeholder="Mật khẩu" required>
                <div id="eye">
                    <i class="fas fa-eye"></i>
                </div>
            </div>
            <input type="submit" value="Đăng Nhập" class="form-submit">
            <p class="switch-form-text">Chưa có tài khoản? <a href="./locdangki.html">Đăng ký ngay!!</a></p>
        </form>
    </div>
<footer class="main-footer">
    <div class="footer-container">
        
        <div class="footer-left">
            <p>&copy; 2026 <span class="footer-brand">9oH</span>. Tất cả các quyền được bảo lưu.</p>
        </div>

        <div class="footer-right">
            <a href="#">Điều khoản sử dụng</a>
            <a href="#">Chính sách bảo mật</a>
            <a href="#">Trợ giúp</a>
        </div>

    </div>
</footer>

</body>
</html>
